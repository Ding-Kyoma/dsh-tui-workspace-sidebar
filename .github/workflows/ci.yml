name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check:manifest

      - name: Check the tarball
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("node:fs");
            const parsed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
            const pack = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            const files = new Set(pack.files.map(file => file.path));
            const required = [
              "index.js", "model.js", "tracker.js", "store.js", "panel.js",
              "jump.js", "questions.js", "current.js", "strings.js",
              "dsh-plugin.json", "cordis.patch.yml", "README.md", "LICENSE",
            ];
            for (const file of required) {
              if (!files.has(file)) {
                console.error("missing from tarball: " + file);
                process.exit(1);
              }
            }
            console.log("tarball files: " + pack.files.length);
          '
