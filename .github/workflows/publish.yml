name: publish

# Tag-driven release, matching the dsh-TUI ecosystem convention: the tag must
# equal `v` + package.json version. The repository uses npm trusted publishing
# (OIDC); no NPM_TOKEN is required. The publish step is idempotent: a tag for an
# already-published version skips the registry write.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check:manifest

      - name: Check the tag matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const expected = "v" + pkg.version;
            if (process.env.GITHUB_REF_NAME !== expected) {
              console.error("tag " + process.env.GITHUB_REF_NAME + " does not match " + expected);
              process.exit(1);
            }
          '

      - name: Check whether this version is already on npm
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-tui-workspace-sidebar@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "dsh-tui-workspace-sidebar@$version is already published; skipping npm publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
        if: steps.published.outputs.already != 'true'
