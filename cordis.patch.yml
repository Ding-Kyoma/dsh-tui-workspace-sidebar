# Workspace sidebar for dsh-tui.
#
# Install (npm, once published):
#   dsh plugin --profile dsh-tui add dsh-tui-workspace-sidebar
#
# Until the npm release, install from a checkout:
#   npm install
#   dsh plugin --profile dsh-tui add link:$PWD
#
# The CLI adds the package to the profile's dependencies and, because this
# package declares `dsh.bundle.patch`, to `dsh.profile.bundles`.
#
# Tune it by id from the profile's own cordis.patch.yml. A row patch replaces
# the whole `config`, so restate every key you need:
#
#   - id: workspace-sidebar
#     config:
#       lang: zh
#       stateFile: ~/.dsh-tui/workspace-sidebar.json
#       shortcut: alt+w
#       retentionHours: 168 # finished rows linger this long (7 days) after last activity; 0 = drop once read
#       relayQuestions: true # park a background ask and show the green dot; false only disables parking (the dot for an ask already on screen stays)
#
- insert:
    - id: workspace-sidebar
      name: 'dsh-tui-workspace-sidebar'
